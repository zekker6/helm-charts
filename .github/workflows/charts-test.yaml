name: "Charts: Test"

on:
  workflow_call:
    inputs:
      checkoutCommit:
        required: true
        type: string
      chartsToTest:
        description: >
          A JSON encoded array of charts to lint
        type: string
        required: true
      overrideDeps:
        description: >
          A JSON encoded array of dependencies to override before testing
        type: string
        required: false
        default: "[]"

env:
  HELM_VERSION: 3.19.4

jobs:
  install-chart:
    name: Install chart
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    if: ${{ inputs.chartsToTest != '[]' && inputs.chartsToTest != '' }}
    strategy:
      matrix:
        chart: ${{ fromJSON(inputs.chartsToTest) }}
        # Versions here: https://github.com/k3s-io/k3s/releases
        k8s_version: ["v1.33", "v1.34", "v1.35", "v1.36"]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkoutCommit }}

      - name: Install Kubernetes tools
        uses: yokawasa/action-setup-kube-tools@f8b2f6cdd1eb8575530049beacfe5d04c0ea8944 # v0.14.1
        with:
          setup-tools: |
            helmv3
          helm: "${{ env.HELM_VERSION }}"
          kubectl: "${{ matrix.k8s_version }}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Create k3d cluster
        uses: nolar/setup-k3d-k3s@v1
        with:
          version: ${{ matrix.k8s_version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove node taints
        run: |
          kubectl taint --all=true nodes node.cloudprovider.kubernetes.io/uninitialized- || true

      - name: Setup redis and postgres for testing
        run: |
          kubectl create namespace databases
          kubectl apply --namespace databases -f .ci/deps/redis -f .ci/deps/postgres
          sleep 3 # give a little time for pods to start
          kubectl wait --for=condition=Ready --timeout=120s pod -n databases --all

      - name: Override chart dependencies
        uses: ./.github/actions/override-chart-deps
        if: ${{ inputs.overrideDeps != '[]' }}
        with:
          chart: ${{ matrix.chart }}
          overrides: ${{ inputs.overrideDeps }}

      - name: Run chart-testing (install)
        run: ct install --config .ci/ct/ct.yaml --charts "charts/${{ matrix.chart }}"

  # Summarize matrix https://github.community/t/status-check-for-a-matrix-jobs/127354/7
  install_success:
    needs:
      - install-chart
    if: |
      always()
    name: Install successful
    runs-on: ubuntu-26.04
    steps:
      - name: Check install matrix status
        if: ${{ (inputs.chartsToTest != '[]' && inputs.chartsToTest != '') && needs.install-chart.result != 'success' }}
        run: exit 1

  unittest-chart:
    name: Unit-test chart
    runs-on: ubuntu-26.04
    if: ${{ inputs.chartsToTest != '[]' && inputs.chartsToTest != '' }}
    strategy:
      matrix:
        chart: ${{ fromJSON(inputs.chartsToTest) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkoutCommit }}

      - name: Install Kubernetes tools
        uses: yokawasa/action-setup-kube-tools@f8b2f6cdd1eb8575530049beacfe5d04c0ea8944 # v0.14.1
        with:
          setup-tools: |
            helmv3
          helm: "${{ env.HELM_VERSION }}"

      - name: Override chart dependencies
        uses: ./.github/actions/override-chart-deps
        if: ${{ inputs.overrideDeps != '[]' }}
        with:
          chart: ${{ matrix.chart }}
          overrides: ${{ inputs.overrideDeps }}

      - name: Run tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.2.1 --verify=false
          helm dep update "charts/${{ matrix.chart }}"
          helm unittest -f "tests/**/*_test.yaml" "charts/${{ matrix.chart }}"

  # Summarize matrix https://github.community/t/status-check-for-a-matrix-jobs/127354/7
  unittest_success:
    needs:
      - unittest-chart
    if: |
      always()
    name: Unittest successful
    runs-on: ubuntu-26.04
    steps:
      - name: Check unittest matrix status
        if: ${{ (inputs.chartsToTest != '[]' && inputs.chartsToTest != '') && needs.unittest-chart.result != 'success' }}
        run: exit 1
