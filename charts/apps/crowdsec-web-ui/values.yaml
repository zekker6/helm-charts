# IMPORTANT NOTE
#
# This chart inherits from the k8s common library chart.
# Check its default values and options here:
# https://github.com/k8s-at-home/library-charts/tree/main/charts/stable/common/values.yaml
#

image:
  # -- image repository
  repository: ghcr.io/theduffman85/crowdsec-web-ui
  # -- image pull policy
  pullPolicy: IfNotPresent
  # -- image tag
  tag: "2026.8.3"

# -- CrowdSec Web UI configuration.
# See the upstream config.example.yaml file for the complete reference.
# @default -- See values.yaml
config:
  # Disable built-in authentication if an external proxy already protects
  # access to the UI.
  # auth:
  #   enabled: false
  storage:
    dataDir: /data
  crowdsec:
    sync:
      lookback: 168h
  instances:
    - id: default
      name: CrowdSec
      lapi:
        url: http://crowdsec:8080

# -- Environment variables for `CONFIG_*` overrides and secrets referenced by
# `config`.
env: []

envFrom: []
#  - secretRef:
#      name: cs-web-ui-env

service:
  main:
    ports:
      http:
        port: 3000

ingress:
  main:
    enabled: false
    hosts:
      - host: "example.local"
        paths:
          - pathType: "Prefix"
            path: /
    tls: []

persistence:
  # -- Configure persistence for data to use sqlite backend.
  # @default -- See values.yaml
  data:
    enabled: true
    mountPath: /data
    accessMode: ReadWriteOnce
    size: 350Mi
    emptyDir:
      enabled: false

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"

controller:
  strategy: Recreate
  replicas: 1

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 20Mi
